<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kajun Peps</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08030f;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}
.logo{width:100%;display:block;border-radius:16px;box-shadow:0 10px 35px rgba(116,37,255,.4)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.btn{display:inline-block;padding:14px 24px;border-radius:12px;background:#fff;color:#32106b;text-decoration:none;font-weight:800}
section{margin:24px 0}
h2{text-align:center;font-size:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.product{background:#fff;color:#160d20;border-radius:14px;padding:18px;min-height:95px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 7px 20px #0006}
.product b{font-size:18px;margin-bottom:8px}
.product span{color:#6420a8;font-weight:800}
.contact{background:linear-gradient(135deg,#24103c,#4e1590);border-radius:18px;padding:25px;text-align:center}
footer{text-align:center;padding:25px;opacity:.7}
@media(max-width:600px){.wrap{padding:8px}h2{font-size:26px}}


.payments{margin:28px 0;background:linear-gradient(135deg,#24103c,#4e1590);padding:24px;border-radius:18px;text-align:center}
.payment-grid{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.payment-card{background:#fff;color:#32106b;font-weight:800;padding:14px 24px;border-radius:12px;min-width:130px}

</style>
